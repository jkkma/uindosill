name: Release

# A v* tag builds the release. Nothing here runs on a push to a branch: this job produces ~1.8 GB
# of assets and publishes them under someone's name, which is not a thing to do on every commit.
#
# Why windows-latest, when everything else in this repository builds on Linux and the cross-publish
# is a deliberate design constraint. Three reasons, none of them taste:
#
#   1. The CUDA channel cannot be vendored anywhere else. scripts/vendor-cuda.ps1 reads a PE import
#      table against System32 to prove the drop's dependencies resolve, and that is Windows.
#   2. vpk compresses delta packages with zstd. On Windows it uses the copy bundled in its own
#      package; elsewhere it wants zstd on PATH, and if it is missing it does not fail — it warns
#      and falls back to bsdiff, which in the 1.2.0 line produces patches Update.exe cannot apply
#      (velopack/velopack#1008). A silent degradation that surfaces as a failed update on a user's
#      machine is not a risk worth taking to save a runner.
#   3. `vpk [win] pack` does cross-build from Linux, and the packaging script passes that directive,
#      so this is a choice rather than a limit. docs/UNPROVEN.md records that the Linux route is
#      verified in Velopack's documentation and its own CI, and has never been run here.
#
# The build-and-test job in ci.yml keeps proving the Linux cross-publish still works on every push,
# so nothing is lost by packaging elsewhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the leading v (e.g. 1.0.0-rc.1)."
        required: true
      draft:
        description: "Also create a DRAFT release (collaborators only, nothing public, no tag created). Off: build the assets and publish nothing."
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The bundled Python the installer carries is assembled by scripts/bundle-python.ps1, which
      # installs the pinned wheels with the HOST interpreter's pip and refuses to run unless that
      # interpreter is the same feature version as the bundle. `pip install --target` resolves wheels
      # for whatever is running it, so a 3.13 runner would put cp313 wheels into a cp312 bundle and
      # the failure would be an ImportError on a user's machine rather than an error here.
      #
      # Pinned to 3.12 for that reason, and it must move whenever the version in bundle-python.ps1
      # does. The runner image's default Python is not relied on: it changes without warning.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # vpk is pinned in .config/dotnet-tools.json, and scripts/package-windows.ps1 refuses to run
      # if that pin and the Velopack PackageVersion in Directory.Packages.props disagree. Velopack
      # itself only logs a mismatch — the throw is commented out in 1.2.0 — so the check that stops
      # a mismatched installer being built is ours.
      - name: Restore the pinned vpk
        run: dotnet tool restore

      # The dispatch input reaches bash as an environment variable, never as ${{ }} inside the
      # script body: expression substitution happens before the shell parses the line, so an input
      # containing a quote would break the step and one containing a semicolon would run on a
      # runner holding contents: write.
      - name: The version comes from the tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi

          # It becomes a filename and a package version, so it has to look like one.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version this can package (expected 1.2.3 or 1.2.3-rc.1)."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A hyphen means a prerelease, and GitHub does not infer that from the tag: without it an
          # rc would be published as Latest and served to everyone by the default update channel.
          if printf '%s' "$version" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Packaging $version"

      # This is the only build and test that runs for a tag. ci.yml is `on: push: branches: ["**"]`,
      # and a tag ref matches no branch pattern — so pushing v1.0.0 starts this workflow and nothing
      # else. The suite has usually run on Linux for the commit being tagged, but nothing enforces
      # that, and a tag pushed on its own would otherwise reach a release with no test run at all.
      # It is also the only place the suite runs on Windows.
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Uindosill.slnx --configuration Release
          dotnet test Uindosill.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Check the counts and Python launch rules
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-test-counts.py --no-run
          python scripts/check-test-counts.py --self-check
          python scripts/check-diariser-auto.py
          python scripts/check-python-launch.py
          python scripts/check-codex-hooks.py

      - name: Parse every PowerShell script and check the Drive route
        shell: pwsh
        run: |
          $e = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $t = $err = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$err) > $null
            $e += $err
          }
          $e | ForEach-Object { "{0}: {1}" -f $_.Extent.File, $_.Message }
          if ($e.Count -ne 0) { throw "$($e.Count) PowerShell parse error(s)." }
          pwsh -NoProfile -File scripts/check-drive-memory.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The isolated Drive route checks failed.' }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-test-results-${{ steps.version.outputs.version }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7

      # vpk builds a delta by diffing against packages already present in --outputDir. A fresh
      # runner has none, so without this step every release ships full packages only and every user
      # re-downloads the whole application on every update — 77 MB where 74 KB would do. Failure is
      # not fatal and must not be: before the first release there is nothing to download, and a
      # missing delta is a slow update rather than a broken one.
      #
      # **`--pre` is what makes it find anything, and it was missing until 2026-09-06.** Every
      # release this project has published is a prerelease, and without that flag
      # `vpk download github` considers only stable ones: it reported "No releases found" against a
      # repository holding three, seeded nothing, and said so nowhere the job could see, because it
      # exits 0 after giving up. rc.10, rc.11 and rc.12 therefore shipped full packages only — a
      # 754 MB update on the default channel and about 2 GB on win-cuda, where a delta is a
      # fraction of it. Measured against the pinned vpk 1.2.0 on this repository the day it was
      # found: without the flag, "Found 0 release(s)" and nothing written; with it, "Found 3" and
      # the download begins. **That a delta is then built and uploaded is still unproven** — it
      # needs a release seeded from a previous one, which is the next one.
      - name: Seed the previous release so deltas can be built
        shell: pwsh
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path packaging/releases | Out-Null

          foreach ($channel in 'win', 'win-cuda') {
            dotnet vpk download github --repoUrl $env:REPO_URL --channel $channel `
                                       --outputDir packaging/releases --token $env:GH_TOKEN `
                                       --skip-updates --pre
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::notice::No previous '$channel' release to diff against - this release ships full packages only."
            }
          }

          $seeded = @(Get-ChildItem packaging/releases -Filter *.nupkg -ErrorAction SilentlyContinue)
          $seeded | Select-Object Name, Length | Format-Table -AutoSize

          # The exit code above cannot report an empty seed and never could: vpk logs "Aborting"
          # and exits 0 when it finds nothing, so that `if` stays silent and the step goes green
          # having downloaded nothing. Counting what landed is the only thing that notices. A
          # warning rather than a failure, because before a channel's first release there is
          # genuinely nothing to seed — but not silence, which is what hid this for three releases.
          if ($seeded.Count -eq 0) {
            Write-Host "::warning::Nothing was seeded, so this release ships full packages only and every user re-downloads the whole application. Expected before a channel's first release; after that it means the seed has stopped finding published releases."
          }

          exit 0

      # Both flavours. The script vendors the pinned natives per channel, publishes, drops the
      # backend directories the channel does not promise, packs, and then opens each nupkg and
      # asserts its native payload against what that channel claims — including the LICENSE beside
      # every parakeet.dll, because parakeet.cpp is MIT and a binary shipped without its notice is
      # a licence breach nothing else in this pipeline would report.
      - name: Build both installer channels
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ steps.version.outputs.version }}"

      # The bundled Python's notices in NOTICE.md are generated from an assembled bundle, and this
      # is the only place in CI where one exists — the Linux build-and-test job cannot make one,
      # since bundle-python.ps1 needs a Windows embeddable CPython and a matching host pip. So the
      # guard runs here, after packing, against the bundle a user actually receives.
      #
      # It fails on two things: the table no longer matching the wheels (a pin moved and the notice
      # did not), and a distribution shipping no licence text that is not already recorded as a gap.
      # Both are licence breaches that nothing else in this pipeline would report, which is the same
      # reasoning that puts the parakeet.dll LICENSE assertion in the step above.
      - name: The bundled Python's notices match the bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path packaging -Recurse -Directory -Filter python |
            Where-Object { Test-Path (Join-Path $_.FullName 'Lib/site-packages') } |
            Select-Object -First 1
          if (-not $bundle) {
            throw "No assembled Python bundle under packaging/. package-windows.ps1 ran with -SkipPython, or its layout moved."
          }
          Write-Host "checking NOTICE.md against $($bundle.FullName)"
          # Preserve the measured table even when the guard fails, so an unpinned transitive
          # update can be reviewed without guessing its version or rebuilding just for metadata.
          $export = @'
          import json, runpy, sys
          from pathlib import Path
          tool = runpy.run_path('scripts/collect-python-notices.py')
          bundle = Path(sys.argv[1])
          rows, problems = tool['collect'](bundle)
          Path('packaging/python-notices.md').write_text(tool['render'](rows, bundle), encoding='utf-8')
          Path('packaging/python-notices.json').write_text(json.dumps({'distributions': rows, 'problems': problems}, indent=2), encoding='utf-8')
          '@
          python -c $export $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not record the assembled bundle notices.' }
          python scripts/collect-python-notices.py --bundle $bundle.FullName --check
          if ($LASTEXITCODE -ne 0) { throw 'NOTICE.md does not describe the bundle this run built.' }

      - name: Retain the assembled bundle's notice metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundled-python-notices-${{ steps.version.outputs.version }}
          path: |
            packaging/python-notices.md
            packaging/python-notices.json
          if-no-files-found: ignore
          retention-days: 7

      # The CLI is not in the installer — decision 3, 2026-08-16: Velopack has no PATH feature, so
      # bundling it would be custom code on install and on uninstall. It ships as the zip beside it,
      # which is the artefact CI has produced all along.
      - name: Publish the CLI for the zip beside the installer
        run: dotnet publish src/Parakeet.Cli --configuration Release -r win-x64 -o packaging/cli-win-x64

      # The step above ran after the win-cuda channel was vendored, and build/NativeAssets.targets
      # globs native/** unfiltered — so the CLI publish carries the CUDA drop as well, which would
      # take this zip from ~250 MB to over a gigabyte without anything saying so. The CLI ships the
      # same backends as the default installer; the rest is dropped here and the result asserted,
      # because a size regression nobody measures is one nobody notices.
      #
      # Since 2026-08-23 the same applies to yt-dlp, Deno, ffmpeg and libmpv: scripts/package-windows.ps1
      # vendors them for the installer, so the CLI publish inherits them too. Nothing in the CLI can
      # use any of them — links, video and muxing are all in the desktop application — so they are
      # dropped rather than charged to every command-line download.
      #
      # And since 2026-08-24, the llm tree: the ask tier's llama-server drops are vendored for the
      # installer channels, the Ask panel is the only thing that starts that server, and no CLI verb
      # does — `retrieve` is tier 0 and needs no model. rc.4's first attempt is the observation: with
      # llm/ inherited whole (the win-cuda channel's cuda drop included), this zip measured 621.9 MB
      # against rc.3's 60.7, and the guard below caught it exactly as written.
      - name: Zip the CLI, without the drops it inherited
        shell: pwsh
        run: |
          $native = 'packaging/cli-win-x64/native/win-x64'
          foreach ($drop in 'cuda', 'tools', 'ffmpeg', 'mpv', 'llm') {
            if (Test-Path "$native/$drop") {
              Write-Host "dropping native/win-x64/$drop from the CLI zip"
              Remove-Item -LiteralPath "$native/$drop" -Recurse -Force
            }
          }

          foreach ($backend in 'cpu', 'vulkan') {
            foreach ($file in 'parakeet.dll', 'LICENSE') {
              if (-not (Test-Path -LiteralPath "$native/$backend/$file")) {
                throw "The CLI publish is missing native/win-x64/$backend/$file."
              }
            }
          }

          Compress-Archive -Path packaging/cli-win-x64/* `
                           -DestinationPath 'packaging/releases/uindosill-cli-win-x64.zip'

          $size = (Get-Item 'packaging/releases/uindosill-cli-win-x64.zip').Length
          Write-Host "uindosill-cli-win-x64.zip: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -gt 400MB) {
            throw "The CLI zip is $([math]::Round($size / 1MB, 1)) MB. That is the CUDA drop coming along again."
          }

      - name: Smoke-import the actual Python bundle and CUDA overlay
        shell: pwsh
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # All installer and CLI assets already exist; free only these task-owned staging
          # directories before extracting the separate CUDA download. Keep Python and releases/.
          foreach ($path in 'packaging/win', 'packaging/win-cuda', 'packaging/cli-win-x64', 'native') {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }
          if (Test-Path -LiteralPath packaging/python-bundle.zip) {
            Remove-Item -LiteralPath packaging/python-bundle.zip
          }
          python scripts/check-bundled-python.py --bundle packaging/python-bundle/python `
            --scratch packaging/import-smoke --repo $env:GITHUB_REPOSITORY `
            --output packaging/python-import-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'The actual Python packages failed their import smoke check.' }

      - name: Retain actual Python import diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-import-smoke-${{ steps.version.outputs.version }}
          path: packaging/python-import-smoke.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Check the release files and update feeds
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/check-release-assets.py --root packaging/releases --version "$VERSION" \
            --commit "$COMMIT_SHA" --output packaging/releases/release-verification.json

      # Named by version rather than `packaging/releases/` whole, for the reason the publish step's
      # globs are: since the seeding step began working, that directory also holds the *previous*
      # release's packages, and uploading the lot doubled this artefact and put about 2.7 GB of
      # somebody else's release inside a file named after this one. What is listed here is what
      # this release consists of — the same set the publish step uploads.
      - uses: actions/upload-artifact@v7
        with:
          name: uindosill-release-${{ steps.version.outputs.version }}
          path: |
            packaging/releases/UindosillDesktop-*-Setup.exe
            packaging/releases/UindosillDesktop-${{ steps.version.outputs.version }}-full.nupkg
            packaging/releases/UindosillDesktop-${{ steps.version.outputs.version }}-delta.nupkg
            packaging/releases/UindosillDesktop-${{ steps.version.outputs.version }}-win-cuda-full.nupkg
            packaging/releases/UindosillDesktop-${{ steps.version.outputs.version }}-win-cuda-delta.nupkg
            packaging/releases/releases.*.json
            packaging/releases/uindosill-*.zip
            packaging/releases/release-verification.json
          retention-days: 7

      # Only a tag publishes. A workflow_dispatch run builds the same assets and stops at the
      # artefact above, so the whole thing can be exercised without creating a release.
      #
      # Every asset name is distinct across the two channels — Velopack suffixes a non-default
      # channel's files and leaves the default channel's bare — so both live on one release without
      # colliding. Observed rather than assumed; docs/UNPROVEN.md has the listing.
      #
      # RELEASES and RELEASES-win-cuda are deliberately not uploaded: they are the Squirrel-era feed
      # files, superseded by releases.<channel>.json, and the default channel's is named RELEASES
      # with no channel in it — the one filename that would collide if a third channel ever appeared.
      #
      # The delta packages are uploaded because without them every update is a full re-download:
      # rc.1 to rc.2 was 74 KB as a delta against 77 MB as a full package, and a release that omits
      # them still works while being a thousand times more expensive for every user who updates.
      # Deltas only exist from the second release onwards, so the glob is allowed to match nothing.
      #
      # The condition tests the EVENT, not only the ref: workflow_dispatch accepts a tag in its ref
      # selector, so a ref test alone would let a dispatch run publish a real release while its own
      # input description promises it does not.
      #
      # The dispatch path exists so the publish itself can be rehearsed — building the assets proves
      # a lot, but not that `gh release create` names files that exist. It is hard-wired to --draft:
      # a draft is visible only to collaborators, creates no tag, and has to be published by a human,
      # so the worst a mistaken dispatch can do is leave something for someone to delete.
      - name: Publish the release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.draft)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd packaging/releases

          # A dispatch may name a version that already has a tag. The assets must describe that
          # exact commit, including when the tag is annotated and needs peeling.
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -n "$refs" ]; then
            tagged_commit=$(printf '%s\n' "$refs" | tail -n 1 | cut -f 1)
            if [ "$tagged_commit" != "$COMMIT_SHA" ]; then
              echo "::error::$TAG resolves to $tagged_commit, but these assets were built from $COMMIT_SHA."
              exit 1
            fi
          fi

          # **The nupkg globs carry the version, and that became load-bearing on 2026-09-06.** This
          # directory holds the packages vpk was seeded with as well as the ones just built, so a
          # bare `UindosillDesktop-*-full.nupkg` matches the *previous* release's packages too:
          # `v1.0.0-rc.13` published rc.12's two full packages alongside its own, 2,748,837,493
          # bytes of a release re-uploading its predecessor. Exact filenames also stop 1.0.0-*
          # from including 1.0.0-rc.* when the first stable release is seeded from a candidate.
          assets=(
            UindosillDesktop-win-Setup.exe
            UindosillDesktop-win-cuda-Setup.exe
            "UindosillDesktop-$VERSION-full.nupkg"
            "UindosillDesktop-$VERSION-win-cuda-full.nupkg"
            releases.win.json
            releases.win-cuda.json
            uindosill-cli-win-x64.zip
            uindosill-python-win-x64.zip
            release-verification.json
          )
          for delta in "UindosillDesktop-$VERSION-delta.nupkg" "UindosillDesktop-$VERSION-win-cuda-delta.nupkg"; do
            if [ -s "$delta" ]; then assets+=("$delta"); fi
          done

          # Both installer channels, their full packages and feeds, and both command-line zips
          # must exist. Deltas are optional because a repository may have no previous release.
          for required in \
            UindosillDesktop-win-Setup.exe \
            UindosillDesktop-win-cuda-Setup.exe \
            "UindosillDesktop-$VERSION-full.nupkg" \
            "UindosillDesktop-$VERSION-win-cuda-full.nupkg" \
            releases.win.json \
            releases.win-cuda.json \
            uindosill-cli-win-x64.zip \
            uindosill-python-win-x64.zip
          do
            if [ ! -s "$required" ]; then
              echo "::error::$required was not produced, so this release would be incomplete."
              exit 1
            fi
          done

          for asset in "${assets[@]}"; do
            size=$(wc -c < "$asset")
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$asset is at or above GitHub's 2 GiB asset limit."
              exit 1
            fi
          done

          printf 'uploading %s\n' "${assets[@]}"

          # A prerelease tag has to be marked as one. GitHub does not infer it from the tag name, so
          # an unmarked rc becomes the repository's Latest release — which the default update channel
          # would then offer to every stable user.
          # The asset list has files whose names do not explain themselves, and a release body
          # that is nothing but "Full Changelog" leaves a first-time downloader guessing between
          # two installers, a CLI zip, an interpreter zip that only CLI users need, four numbered
          # parts and the update feed. .github/release-notes.md is that guide, and it carries no
          # byte counts so it cannot go stale against the assets beside it. The generated commit
          # changelog is appended to the same guide on both creation and retry.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$COMMIT_SHA" --jq .body \
            > "$RUNNER_TEMP/generated-release-notes.md"
          cat "$GITHUB_WORKSPACE/.github/release-notes.md" "$RUNNER_TEMP/generated-release-notes.md" \
            > "$RUNNER_TEMP/release-notes.md"
          flags=(--notes-file "$RUNNER_TEMP/release-notes.md" --target "$COMMIT_SHA" \
            --prerelease="$PRERELEASE")

          if [ "$DRAFT" = "true" ]; then
            # No --verify-tag on this path: a draft names a tag that need not exist yet, and GitHub
            # creates it only if a human publishes the draft.
            flags+=(--draft)
            echo "::notice::Creating a DRAFT release for $TAG. Nothing is public and no tag is created."
          else
            flags+=(--verify-tag)
          fi

          # Idempotent, because the alternative is losing half an hour of packaging to a dropped
          # connection on the last step and then having to delete the release by hand to re-run.
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            if [ "$DRAFT" = "true" ] && ! jq -e '.isDraft == true' "$RUNNER_TEMP/release-state.json" > /dev/null; then
              echo "::error::$TAG is already public; a rehearsal cannot replace it."
              exit 1
            fi
            echo "::notice::$TAG already has a release; uploading the assets into it."
            gh release upload "$TAG" --clobber "${assets[@]}"
            # A CUDA-only preparation draft can predate the final application commit and notes.
            # Retrying must update metadata too, rather than silently retaining an obsolete target.
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$COMMIT_SHA" --draft="$DRAFT" --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" --title "$TAG" "${flags[@]}" "${assets[@]}"
          fi
