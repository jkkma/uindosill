name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # Everything in this repository builds and tests on Linux with no weights and no display.
  # That is a design constraint, not a convenience: a test that needs 670 MB of weights is a
  # test CI will never run.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Uindosill.slnx

      - name: Build
        run: dotnet build Uindosill.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Uindosill.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # Three documents quote a test total and all three sat at 258 for several commits after the
      # suite reached 265. The numbers are cheap to check against the run that just happened, and
      # a repository whose rule is "measured or marked unproven" should not ship a stale one.
      # --no-run because the step above already produced the TRX files: re-running them here would
      # hide a reordering of this job rather than report it.
      - name: The documented test counts must match the suite
        run: python3 scripts/check-test-counts.py --no-run

      # The states that script guards against each need a working copy in one specific shape — a
      # retired project's gitignored leftovers, a results file older than its assembly — and CI's
      # workspace is clean, so the step above exercises neither. This builds both in a temporary
      # directory. It needs no toolchain and takes under a second; a guard nobody tests is the
      # thing this repository keeps rediscovering.
      - name: The count script's own rules must hold
        run: python3 scripts/check-test-counts.py --self-check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The Windows executables cross-publish from Linux. This job exists to catch the failure the
  # brief warns about and this repository has already made once: a RuntimeIdentifier no longer
  # implies self-contained on .NET 8+, so a publish can be green and still framework-dependent.
  # Counting the output files is the check.
  #
  # It also vendors the parakeet.cpp natives first, so the win-x64 artefact is one that can
  # transcribe rather than a managed shell around an empty native/ directory. The vendoring is the
  # same script a developer runs — scripts/vendor-natives.ps1 — which downloads the pinned v0.5.0
  # archives, refuses to unpack anything whose SHA-256 is not the one recorded in
  # docs/NATIVE-BINARIES.md, and fails if a pin it trusts is missing from that table. Only win-x64:
  # upstream publishes no win-arm64 asset, so that leg's artefact still carries no natives and
  # docs/NATIVE-BINARIES.md says so.
  publish-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Vendor the pinned parakeet.cpp natives (cpu and vulkan)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./scripts/vendor-natives.ps1

      - name: Publish CLI
        run: dotnet publish src/Parakeet.Cli --configuration Release -r ${{ matrix.rid }} -o out/cli-${{ matrix.rid }}

      - name: Publish desktop app
        run: dotnet publish src/Parakeet.App --configuration Release -r ${{ matrix.rid }} -o out/app-${{ matrix.rid }}

      # Since single-file was turned on, neither hostfxr.dll nor a file count says anything: the
      # runtime is inside the executable and the publish is a few dozen files. The executable's own
      # size is what separates a self-contained build from a framework-dependent one — about 98 MB
      # of runtime, against a couple of megabytes without it.
      - name: Assert the publish is genuinely self-contained
        shell: bash
        run: |
          set -euo pipefail
          for pair in "out/cli-${{ matrix.rid }}:uindosill" "out/app-${{ matrix.rid }}:Uindosill"; do
            dir="${pair%%:*}"
            stem="${pair##*:}"
            exe="$dir/$stem"
            [ -f "$exe.exe" ] && exe="$exe.exe"

            if [ ! -f "$exe" ]; then
              echo "::error::$dir has no $stem executable."
              exit 1
            fi

            bytes=$(stat -c%s "$exe")
            count=$(find "$dir" -type f | wc -l)
            echo "$dir: $count files, $(( bytes / 1048576 )) MB executable"

            if [ "$bytes" -lt 52428800 ]; then
              echo "::error::$exe is $bytes bytes — a framework-dependent build, which needs the exact .NET runtime on every machine."
              echo "A RuntimeIdentifier does not imply SelfContained on .NET 8+. See Directory.Build.targets."
              exit 1
            fi
          done

      # The vendoring step above put the natives in native/; this checks they came out the other
      # side, in both apps, in the layout the loader searches. LICENSE is asserted alongside the
      # binary because parakeet.cpp is MIT and build/NativeAssets.targets exists partly to carry that
      # notice — a publish with the DLL and without it redistributes an MIT binary without its notice,
      # and nothing else in the pipeline would say so.
      - name: Assert the natives and their licences are in the publish output
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          for dir in out/cli-win-x64 out/app-win-x64; do
            for backend in cpu vulkan; do
              for file in parakeet.dll LICENSE; do
                path="$dir/native/win-x64/$backend/$file"
                if [ ! -s "$path" ]; then
                  echo "::error::$path is missing or empty. build/NativeAssets.targets globs native/**/*.dll and native/**/LICENSE; one of them did not fire."
                  exit 1
                fi
              done
              echo "$dir/native/win-x64/$backend: parakeet.dll $(stat -c %s "$dir/native/win-x64/$backend/parakeet.dll") bytes, LICENSE present"
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: uindosill-${{ matrix.rid }}
          path: out/
          retention-days: 7

  # The seam that keeps an engine swap to one project is enforced by an MSBuild target inside
  # Parakeet.Core.csproj. This proves the guard actually fires rather than trusting that it would.
  core-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: A PackageReference in Parakeet.Core must fail the build
        shell: bash
        run: |
          set -uo pipefail
          cp src/Parakeet.Core/Parakeet.Core.csproj /tmp/core.csproj.bak
          # No Version attribute: central package management would reject that first with
          # NU1008, and this job is testing our guard, not NuGet's.
          python3 - <<'PY'
          path = "src/Parakeet.Core/Parakeet.Core.csproj"
          text = open(path).read()
          injected = '  <ItemGroup>\n    <PackageReference Include="NAudio.Core" />\n  </ItemGroup>\n\n</Project>'
          open(path, "w").write(text.replace("</Project>", injected))
          PY
          if dotnet build src/Parakeet.Core/Parakeet.Core.csproj --nologo > /tmp/guard.log 2>&1; then
            cp /tmp/core.csproj.bak src/Parakeet.Core/Parakeet.Core.csproj
            echo "::error::Parakeet.Core accepted a NuGet dependency. The isolation guard is not working."
            exit 1
          fi
          cp /tmp/core.csproj.bak src/Parakeet.Core/Parakeet.Core.csproj
          grep -q "zero NuGet dependencies" /tmp/guard.log \
            || { echo "::error::Build failed, but not with the isolation guard's message."; cat /tmp/guard.log; exit 1; }
          echo "Guard fired as intended."
